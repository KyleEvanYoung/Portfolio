<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>Photo to Video AR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <video id="arVideo" src="video.mp4" playsinline loop preload="auto"></video>

    <header class="topbar">
      <div><strong>Photo → Video</strong><span>WebAR prototype</span></div>
      <button id="soundBtn" type="button">Sound: off</button>
    </header>

    <section id="startPanel" class="panel">
      <h1>Bring a printed photo to life</h1>
      <p>Point your phone at the registered picture. When it is recognised, its matching video appears.</p>
      <button id="startBtn" class="primary" type="button">Start camera</button>
      <p class="small">Camera access normally requires HTTPS or localhost.</p>
    </section>

    <div id="status" class="status">Ready</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
