<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Image Target Video AR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Image → Video AR</h1><p>Point the camera at one of the three test targets.</p></div>
      <div id="status" class="pill">Loading OpenCV…</div>
    </header>

    <section class="stage" id="stage">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="hud"><span id="match">No target</span><span id="fps">0 FPS</span></div>
      <button id="start">Start camera</button>
    </section>

    <section class="targets">
      <h2>Test targets</h2>
      <div class="grid">
        <article><img src="assets/images/target-1.png" alt="Target 1"><b>Target 1</b><small>plays video-1.mp4</small></article>
        <article><img src="assets/images/target-2.png" alt="Target 2"><b>Target 2</b><small>plays video-2.mp4</small></article>
        <article><img src="assets/images/target-3.png" alt="Target 3"><b>Target 3</b><small>plays video-3.mp4</small></article>
      </div>
    </section>
  </main>

  <div id="videoBank" hidden>
    <video id="v1" src="assets/videos/video-1.mp4" loop muted playsinline preload="auto"></video>
    <video id="v2" src="assets/videos/video-2.mp4" loop muted playsinline preload="auto"></video>
    <video id="v3" src="assets/videos/video-3.mp4" loop muted playsinline preload="auto"></video>
  </div>

  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="window.cvScriptLoaded=true"></script>
  <script src="app.js"></script>
</body>
</html>
