<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello World</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;}
    header{padding:18px 16px;background:#111;color:#fff;}
    .wrap{max-width:1100px;margin:0 auto;padding:16px;}
    .small{opacity:.8;font-size:13px;}
    .code{font-family:ui-monospace,Menlo,monospace;word-break:break-all;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px;}
    .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);}
    .imgbtn{display:block;padding:0;border:0;width:100%;background:#000;cursor:pointer;}
    .imgbtn img{width:100%;height:320px;object-fit:cover;display:block;}
    .meta{padding:12px 12px 14px;}
    .name{font-weight:700;margin:0 0 6px;font-size:15px;}
    .row{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;opacity:.85;margin-top:4px;}
    .pill{background:#eee;padding:4px 8px;border-radius:999px;}
    .status{margin-top:10px;font-size:13px;}

    /* Overlay modal */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.75);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }
    .modal{
      width:min(900px, 100%);
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      min-height:420px;
    }
    @media (max-width: 780px){ .modal{grid-template-columns:1fr;} }
    .modalLeft{background:#000; min-height:320px;}
    .modalLeft img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;}
    .modalRight{padding:18px;display:flex;flex-direction:column;gap:12px;}
    .modalTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
    .logoWrap{display:flex;align-items:center;gap:10px;min-height:34px;}
    .logoWrap img{height:34px;width:auto;max-width:260px;object-fit:contain;}
    .closeBtn{border:0;background:#eee;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;}
    .modalTitle{margin:0;font-size:18px;}
    .modalDesc{margin:0;line-height:1.35;opacity:.9;font-size:14px;}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;}
    .dlBtn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 12px;border-radius:12px;border:0;cursor:pointer;
      font-weight:700;text-decoration:none;background:#111;color:#fff;
    }
    .dlBtn.secondary{background:#2b2b2b;}
    .dlBtn.tertiary{background:#0b6cf0;}
    .mini{font-size:12px;opacity:.75;}

    /* Reader */
    .readerPanel{
      position:fixed; inset:0;
      background:rgba(0,0,0,.85);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:10000;
    }
    .readerInner{
      width:min(900px, 100%);
      max-height:100%;
      background:#101010;
      color:#f5f5f5;
      border-radius:16px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .readerHeader{
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #333;
    }
    .readerTitle{
      font-size:16px;
      font-weight:700;
    }
    .readerClose{
      border:0;background:#333;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;
    }
    .readerBody{
      padding:16px;
      overflow-y:auto;
      max-height:calc(100vh - 80px);
    }
    .line{
      margin:4px 0;
      cursor:pointer;
    }
    .line.Title{
      font-size:22px;
      font-weight:700;
      text-align:center;
      margin:14px 0;
    }
    .line.Header{
      font-size:18px;
      font-weight:700;
      margin:12px 0 6px;
    }
    .line.Subtitle{
      font-size:14px;
      font-style:italic;
      opacity:.9;
    }
    .line.Normal{
      font-size:15px;
    }
    .line.currentLine{
      background:#1f3a7a;
      padding:4px 6px;
      border-radius:6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 style="margin:0;">Hello World</h1>
      <div class="small">Device code (saved on this device):</div>
      <div id="deviceCode" class="code">Generating…</div>
      <div id="status" class="status small"></div>
    </div>
  </header>

  <main class="wrap">
    <h2 style="margin:0 0 10px;">Stories</h2>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Overlay Modal -->
  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalLeft">
        <img id="modalPoster" src="" alt="">
      </div>
      <div class="modalRight">
        <div class="modalTop">
          <div class="logoWrap">
            <img id="modalLogo" src="" alt="logo">
          </div>
          <button id="closeBtn" class="closeBtn">✕</button>
        </div>

        <h3 id="modalTitle" class="modalTitle"></h3>
        <p id="modalDesc" class="modalDesc"></p>

        <div class="row" id="modalPills"></div>

        <div class="btnRow">
          <a id="pdfBtn" class="dlBtn" href="#" download>Download PDF</a>
          <a id="epubBtn" class="dlBtn secondary" href="#" download>Download EPUB</a>
          <button id="readBtn" class="dlBtn tertiary" type="button">Read Now</button>
        </div>

        <div id="modalNote" class="mini"></div>
      </div>
    </div>
  </div>

  <!-- Reader Panel -->
  <div id="readerPanel" class="readerPanel" aria-hidden="true">
    <div class="readerInner">
      <div class="readerHeader">
        <div class="readerTitle" id="readerTitle"></div>
        <button class="readerClose" id="readerCloseBtn">Close</button>
      </div>
      <div class="readerBody" id="readerBody"></div>
    </div>
  </div>

  <!-- stories data -->
  <script src="stories.js"></script>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSeyF_Ot4unrlTCU3jogW5GteHFqjgI3FaN91L5rLBrLddFMqt4GlDWuuQc_EhdxU3oA/exec";

    let DEVICE_CODE = "";
    let CURRENT_STORY = null;
    let currentLineElement = null;

    function generateCode20() {
      const digits = "0123456789";
      let out = "";
      for (let i = 0; i < 20; i++) {
        out += digits[Math.floor(Math.random() * digits.length)];
      }
      return out;
    }

    function getDeviceType() {
      const ua = navigator.userAgent || "";
      if (/android/i.test(ua)) return "Android";
      if (/iPad|iPhone|iPod/.test(ua)) return "iOS";
      if (/tablet/i.test(ua)) return "Tablet";
      if (/mobile/i.test(ua)) return "Mobile";
      return "Desktop";
    }

    function getOrCreateDeviceCode() {
      const key = "deviceCode20";
      let code = localStorage.getItem(key);
      if (!code || code.length !== 20) {
        code = generateCode20();
        localStorage.setItem(key, code);
      }
      return code;
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    async function postToSheet(payload) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      });
    }

    async function registerDevice() {
      try {
        await postToSheet({
          action: "register",
          code: DEVICE_CODE,
          deviceType: getDeviceType(),
          date: new Date().toISOString(),
        });
        setStatus("Registered / updated in Google Sheet.");
      } catch (err) {
        console.error(err);
        setStatus("Error sending device data to Google Sheet.");
      }
    }

    async function sendEvent(storyName, eventType, trackingId = "") {
      try {
        await postToSheet({
          action: "event",
          code: DEVICE_CODE,
          storyName,
          eventType,
          trackingId,
          deviceType: getDeviceType(),
          date: new Date().toISOString(),
        });
      } catch (err) {
        console.error(err);
      }
    }

    // --- Modal / Overlay ---
    const overlay     = document.getElementById("overlay");
    const closeBtn    = document.getElementById("closeBtn");
    const modalPoster = document.getElementById("modalPoster");
    const modalLogo   = document.getElementById("modalLogo");
    const modalTitle  = document.getElementById("modalTitle");
    const modalDesc   = document.getElementById("modalDesc");
    const modalPills  = document.getElementById("modalPills");
    const pdfBtn      = document.getElementById("pdfBtn");
    const epubBtn     = document.getElementById("epubBtn");
    const readBtn     = document.getElementById("readBtn");
    const modalNote   = document.getElementById("modalNote");

    function openModal(story) {
      CURRENT_STORY = story;

      modalPoster.src = story.Background || story.Forefront || "";
      modalPoster.alt = story.Name;

      const logoSrc = story.LogoStyle2 || story.LogoStyle1 || story.LogoStyle3 || "";
      modalLogo.src = logoSrc;
      modalLogo.alt = story.Series || "logo";

      modalTitle.textContent = story.TitleText || story.Name;
      modalDesc.textContent  = story.SmallText || "";

      modalPills.innerHTML = "";
      const addPill = (text) => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = text;
        modalPills.appendChild(pill);
      };
      if (story.storytype) addPill(story.storytype);
      if (story.Series) addPill(story.Series);
      (story.Genres || []).forEach(addPill);

      pdfBtn.href = story.Pdfstory || "#";
      epubBtn.href = story.Epub || "#";

      pdfBtn.style.pointerEvents = story.Pdfstory ? "auto" : "none";
      pdfBtn.style.opacity       = story.Pdfstory ? "1" : ".4";
      epubBtn.style.pointerEvents = story.Epub ? "auto" : "none";
      epubBtn.style.opacity       = story.Epub ? "1" : ".4";

      const hasExcel = !!story.StoryExcel;
      readBtn.disabled = !hasExcel;
      readBtn.style.opacity = hasExcel ? "1" : ".4";

      modalNote.textContent = "Click outside or press Esc to close.";

      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      overlay.style.display = "none";
      overlay.setAttribute("aria-hidden", "true");
      CURRENT_STORY = null;
    }

    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        // Close reader first if open, else close modal
        if (readerPanel.style.display === "flex") closeReader();
        else if (overlay.style.display === "flex") closeModal();
      }
    });

    pdfBtn.addEventListener("click", async (e) => {
      if (!CURRENT_STORY || !CURRENT_STORY.Pdfstory) return;
      e.preventDefault();
      await sendEvent(CURRENT_STORY.Name, "download_pdf");
      setStatus(`Download PDF logged for "${CURRENT_STORY.Name}" (sheet "${DEVICE_CODE}")`);
      window.open(CURRENT_STORY.Pdfstory, "_blank");
    });

    epubBtn.addEventListener("click", async (e) => {
      if (!CURRENT_STORY || !CURRENT_STORY.Epub) return;
      e.preventDefault();
      await sendEvent(CURRENT_STORY.Name, "download_epub");
      setStatus(`Download EPUB logged for "${CURRENT_STORY.Name}" (sheet "${DEVICE_CODE}")`);
      window.open(CURRENT_STORY.Epub, "_blank");
    });

    // --- Reader ---
    const readerPanel   = document.getElementById("readerPanel");
    const readerTitleEl = document.getElementById("readerTitle");
    const readerBody    = document.getElementById("readerBody");
    const readerClose   = document.getElementById("readerCloseBtn");

    function openReader() {
      if (!CURRENT_STORY || !CURRENT_STORY.StoryExcel) return;
      readerTitleEl.textContent = CURRENT_STORY.Name;
      readerBody.innerHTML = "<div class='mini'>Loading...</div>";
      readerPanel.style.display = "flex";
      readerPanel.setAttribute("aria-hidden", "false");
      loadStoryText(CURRENT_STORY);
    }

    function closeReader() {
      readerPanel.style.display = "none";
      readerPanel.setAttribute("aria-hidden", "true");
      readerBody.innerHTML = "";
      currentLineElement = null;
    }

    readerClose.addEventListener("click", closeReader);
    readerPanel.addEventListener("click", (e) => {
      // click background (outside inner) to close
      if (e.target === readerPanel) closeReader();
    });

    readBtn.addEventListener("click", () => {
      if (!CURRENT_STORY || !CURRENT_STORY.StoryExcel) return;
      openReader();
    });

    function toTsvUrl(storyExcelUrl) {
      // User’s example: .../pubhtml?gid=0&single=true
      // We convert to:   .../pub?output=tsv&gid=0
      try {
        if (storyExcelUrl.includes("/pubhtml?")) {
          return storyExcelUrl.replace("/pubhtml?", "/pub?output=tsv&");
        }
        // if they already gave pub?output=tsv just use as is
        return storyExcelUrl;
      } catch (e) {
        return storyExcelUrl;
      }
    }

    function parseTsv(tsvText) {
      const lines = tsvText.trim().split(/\r?\n/);
      return lines.map(line => line.split("\t"));
    }

    async function loadStoryText(story) {
      const url = toTsvUrl(story.StoryExcel);
      try {
        const res = await fetch(url);
        const txt = await res.text();
        const rows = parseTsv(txt);  // [ [text, type, trackingId], ... ]
        renderStoryLines(story, rows);
      } catch (err) {
        console.error(err);
        readerBody.innerHTML = "<div class='mini'>Error loading story text.</div>";
      }
    }

    function renderStoryLines(story, rows) {
      readerBody.innerHTML = "";
      currentLineElement = null;

      rows.forEach((row) => {
        const text       = row[0] || "";
        const type       = (row[1] || "Normal").trim();
        const trackingId = (row[2] || "").trim();

        if (!text) return;

        const div = document.createElement("div");
        div.className = "line " + type;
        div.textContent = text;
        if (trackingId) {
          div.dataset.trackingId = trackingId;
        }

        div.addEventListener("click", async () => {
          // visually mark current line
          if (currentLineElement) currentLineElement.classList.remove("currentLine");
          div.classList.add("currentLine");
          currentLineElement = div;

          if (trackingId) {
            await sendEvent(story.Name, "read_position", trackingId);
            setStatus(`Reading position "${trackingId}" logged for "${story.Name}".`);
          }
        });

        readerBody.appendChild(div);
      });

      if (!readerBody.children.length) {
        readerBody.innerHTML = "<div class='mini'>No text rows found in this story sheet.</div>";
      }
    }

    // --- Render story cards ---
    function renderStories() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      Storys.forEach(story => {
        const card = document.createElement("div");
        card.className = "card";

        const btn = document.createElement("button");
        btn.className = "imgbtn";
        btn.title = "Open story details";
        btn.addEventListener("click", async () => {
          await sendEvent(story.Name, "open");
          setStatus(`Opened: "${story.Name}" (logged to sheet "${DEVICE_CODE}")`);
          openModal(story);
        });

        const img = document.createElement("img");
        img.src = story.Forefront;
        img.alt = story.Name;
        btn.appendChild(img);

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("p");
        name.className = "name";
        name.textContent = story.Name;

        const row1 = document.createElement("div");
        row1.className = "row";

        const typePill = document.createElement("span");
        typePill.className = "pill";
        typePill.textContent = story.storytype || "";

        const seriesPill = document.createElement("span");
        seriesPill.className = "pill";
        seriesPill.textContent = story.Series || "";

        row1.appendChild(typePill);
        row1.appendChild(seriesPill);

        meta.appendChild(name);
        meta.appendChild(row1);

        card.appendChild(btn);
        card.appendChild(meta);
        grid.appendChild(card);
      });
    }

    // Init
    (async function () {
      DEVICE_CODE = getOrCreateDeviceCode();
      document.getElementById("deviceCode").textContent = DEVICE_CODE;

      renderStories();
      await registerDevice();
    })();
  </script>
</body>
</html>
