<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Story Prompt Wheels — Genres & Themes</title>
<style>
  :root {
    --bg: #0f172a;        /* slate-900 */
    --card: #111827;      /* gray-900 */
    --muted: #94a3b8;     /* slate-400 */
    --text: #e5e7eb;      /* gray-200 */
    --accent: #38bdf8;    /* sky-400 */
    --btn: #1f2937;       /* gray-800 */
    --btn-hover: #374151; /* gray-700 */
  }

  * { box-sizing: border-box }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    background: radial-gradient(1200px 800px at 50% -10%, #1e293b 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .app {
    width: min(1100px, 100%);
    display: grid;
    gap: 18px;
  }

  header {
    text-align: center;
  }

  h1 {
    font-size: clamp(1.25rem, 1rem + 1.5vw, 2rem);
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  p.subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  .wheel-card {
    background: linear-gradient(180deg, #0b1220, var(--card));
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
  }

  .wheel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .wheel-title {
    font-weight: 600;
    letter-spacing: .3px;
  }
  .result {
    font-size: clamp(1rem, .9rem + .6vw, 1.25rem);
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .canvas-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 999px;
    outline: 1px solid rgba(148,163,184,.18);
    background: radial-gradient(120% 120% at 20% 15%, #111827 0%, #0b1220 60%);
  }

  /* pointer / needle */
  .needle {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(12px, 1.2vw, 16px);
    height: clamp(18px, 2.2vw, 24px);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    background: var(--accent);
    filter: drop-shadow(0 2px 6px rgba(56,189,248,.45));
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }

  .btn {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
    background: var(--btn);
    color: var(--text);
    border: 1px solid #334155;
    padding: 10px 14px;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: .2px;
    transition: transform .05s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] {
    opacity: .6;
    cursor: not-allowed;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 6px;
  }

  .sr-only {
    position: absolute!important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Story prompt wheels">
    <header>
      <h1>Story Prompt Wheels</h1>
      <p class="subtitle">Spin for a genre and a theme—works on phone and desktop.</p>
    </header>

    <div class="toolbar">
      <button id="spinBoth" class="btn" aria-label="Spin both wheels">🎲 Spin Both</button>
    </div>

    <div class="grid">
      <!-- GENRES -->
      <section class="wheel-card" aria-labelledby="genreTitle">
        <div class="wheel-header">
          <div class="wheel-title" id="genreTitle">🎬 Genre</div>
          <div class="result" id="genreResult" aria-live="polite">—</div>
        </div>
        <div class="canvas-wrap">
          <div class="needle" aria-hidden="true"></div>
          <canvas id="genreWheel" aria-label="Genre wheel" role="img"></canvas>
        </div>
        <div class="controls">
          <div aria-hidden="true" class="muted"></div>
          <button id="spinGenre" class="btn" aria-label="Spin genre wheel">Spin Genre</button>
        </div>
      </section>

      <!-- THEMES -->
      <section class="wheel-card" aria-labelledby="themeTitle">
        <div class="wheel-header">
          <div class="wheel-title" id="themeTitle">🧩 Theme</div>
          <div class="result" id="themeResult" aria-live="polite">—</div>
        </div>
        <div class="canvas-wrap">
          <div class="needle" aria-hidden="true"></div>
          <canvas id="themeWheel" aria-label="Theme wheel" role="img"></canvas>
        </div>
        <div class="controls">
          <div aria-hidden="true" class="muted"></div>
          <button id="spinTheme" class="btn" aria-label="Spin theme wheel">Spin Theme</button>
        </div>
      </section>
    </div>

    <p class="sr-only" id="liveSummary" aria-live="polite"></p>
  </div>

<script>
(() => {
  // ---------- DATA ----------
  const GENRES = [
    "Fantasy","Sci-Fi","Mystery","Thriller","Horror","Romance","Historical",
    "Adventure","Comedy","Drama","Crime","Urban Fantasy","Cyberpunk","Dystopian",
    "Magical Realism","Western","Superhero","Noir"
  ];

  const THEMES = [
    "Redemption","Betrayal","Coming of Age","Forbidden Love","Survival","Identity",
    "Power & Corruption","Revenge","Sacrifice","Freedom vs. Control","Chaos vs. Order",
    "Man vs. Nature","Second Chances","Isolation","Discovery","Justice","Memory","Hope"
  ];

  // Pleasant but distinct palette; repeated if needed.
  const BASE_COLORS = [
    "#60a5fa","#34d399","#f472b6","#f59e0b","#a78bfa","#22d3ee",
    "#f87171","#10b981","#eab308","#fb7185","#2dd4bf","#93c5fd"
  ];

  // ---------- UTILS ----------
  const TAU = Math.PI * 2;
  const rand = (min, max) => Math.random() * (max - min) + min;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // Easing for snappy spin
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  // High-DPI canvas resize
  function fitCanvasToParent(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- WHEEL CLASS ----------
  class Wheel {
    constructor({ canvas, items, colors, onFinish }) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.items = items.slice();
      this.colors = colors;
      this.onFinish = onFinish;

      this.rotation = 0;       // current angle in radians
      this.isSpinning = false;
      this.sectorAngle = TAU / this.items.length;

      fitCanvasToParent(this.canvas);
      this.draw();
      window.addEventListener("resize", () => { fitCanvasToParent(this.canvas); this.draw(); }, { passive: true });
    }

    indexAtPointer() {
      // Pointer is at angle = 0 (top); wheel rotates underneath.
      // Map rotation to [0..n)
      let a = (TAU - (this.rotation % TAU)) % TAU; // normalize so 0 = top
      const i = Math.floor(a / this.sectorAngle) % this.items.length;
      return i;
    }

    draw() {
      const { ctx, canvas } = this;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const size = Math.min(w, h);
      const cx = w / 2, cy = h / 2;
      const r = size * 0.48;
      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(this.rotation);

      // segments
      for (let i = 0; i < this.items.length; i++) {
        const start = i * this.sectorAngle;
        const end   = start + this.sectorAngle;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,r,start,end,false);
        ctx.closePath();
        ctx.fillStyle = this.colors[i % this.colors.length];
        ctx.fill();

        // separator
        ctx.strokeStyle = "rgba(0,0,0,.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,r,start,end,false);
        ctx.stroke();
      }

      // labels
      ctx.fillStyle = "#0b1220";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `${Math.max(10, Math.round(r * 0.11))}px system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial`;
      for (let i = 0; i < this.items.length; i++) {
        const ang = i * this.sectorAngle + this.sectorAngle / 2;
        const tx = Math.cos(ang) * r * 0.67;
        const ty = Math.sin(ang) * r * 0.67;
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(ang);
        const label = this.items[i];
        // Constrain label width by clipping
        const clipW = r * 0.9, clipH = r * 0.3;
        ctx.beginPath();
        ctx.rect(-clipW/2, -clipH/2, clipW, clipH);
        ctx.clip();
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }

      // center cap
      ctx.beginPath();
      ctx.arc(0,0, Math.max(10, r*0.08), 0, TAU);
      ctx.fillStyle = "#0b1220";
      ctx.fill();
      ctx.strokeStyle = "rgba(148,163,184,.4)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    async spin({ minTurns = 3, maxTurns = 5, duration = 2200 }) {
      if (this.isSpinning) return null;
      this.isSpinning = true;

      // Choose target sector randomly, aim for its center
      const targetIndex = Math.floor(rand(0, this.items.length));
      const targetAngle = targetIndex * this.sectorAngle + this.sectorAngle / 2;

      const totalTurns = rand(minTurns, maxTurns);
      const startRot = this.rotation;
      const endRot = startRot + totalTurns * TAU + (TAU - targetAngle); // align chosen index under pointer (top)

      const start = performance.now();
      return new Promise(resolve => {
        const tick = (now) => {
          const t = clamp((now - start) / duration, 0, 1);
          const eased = easeOutCubic(t);
          this.rotation = startRot + (endRot - startRot) * eased;
          this.draw();
          if (t < 1) {
            requestAnimationFrame(tick);
          } else {
            // Snap to exact sector center to avoid fractional drift
            this.rotation = endRot;
            this.draw();
            this.isSpinning = false;
            const finalIndex = this.indexAtPointer();
            const value = this.items[finalIndex];
            this.onFinish?.(value, finalIndex);
            resolve({ value, index: finalIndex });
          }
        };
        requestAnimationFrame(tick);
      });
    }
  }

  // ---------- INIT WHEELS ----------
  const genreWheel = new Wheel({
    canvas: document.getElementById("genreWheel"),
    items: GENRES,
    colors: BASE_COLORS,
    onFinish: (value) => {
      document.getElementById("genreResult").textContent = value;
      announce();
    }
  });

  const themeWheel = new Wheel({
    canvas: document.getElementById("themeWheel"),
    items: THEMES,
    colors: BASE_COLORS.slice(2).concat(BASE_COLORS.slice(0,2)),
    onFinish: (value) => {
      document.getElementById("themeResult").textContent = value;
      announce();
    }
  });

  // ---------- BUTTONS ----------
  const btnGenre = document.getElementById("spinGenre");
  const btnTheme = document.getElementById("spinTheme");
  const btnBoth  = document.getElementById("spinBoth");

  function setDisabled(disabled) {
    btnGenre.disabled = disabled;
    btnTheme.disabled = disabled;
    btnBoth.disabled  = disabled;
  }

  async function spinGenre() {
    setDisabled(true);
    await genreWheel.spin({});
    setDisabled(themeWheel.isSpinning);
  }
  async function spinTheme() {
    setDisabled(true);
    await themeWheel.spin({});
    setDisabled(genreWheel.isSpinning);
  }
  async function spinBoth() {
    setDisabled(true);
    // Start both; wait for both to finish
    await Promise.all([genreWheel.spin({}), themeWheel.spin({})]);
    setDisabled(false);
  }

  btnGenre.addEventListener("click", spinGenre);
  btnTheme.addEventListener("click", spinTheme);
  btnBoth.addEventListener("click", spinBoth);

  // Keyboard support (Enter/Space)
  for (const btn of [btnGenre, btnTheme, btnBoth]) {
    btn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btn.click(); }
    });
  }

  // Live summary for screen readers
  function announce() {
    const g = document.getElementById("genreResult").textContent.trim();
    const t = document.getElementById("themeResult").textContent.trim();
    const live = document.getElementById("liveSummary");
    if (g !== "—" || t !== "—") {
      live.textContent = `Selected ${g !== "—" ? "genre " + g : ""}${(g !== "—" && t !== "—") ? " and " : ""}${t !== "—" ? "theme " + t : ""}.`;
    }
  }
})();
</script>
</body>
</html>
