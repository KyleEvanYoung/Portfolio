<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Story Spin Wheel</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #151821;
    --accent: #4fd1c5;
    --text: #eef3f7;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
    overflow: hidden; /* no scrolling, per request */
  }
  main {
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 12px;
    padding: clamp(8px, 2vw, 16px);
  }
  .stageLabel {
    position: absolute;
    top: 8px;
    left: 12px;
    background: rgba(0,0,0,.5);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: .3px;
  }
  #wheelArea {
    position: relative;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 800px at 50% -20%, #1b2030 10%, #0f121a 60%, #0d0f15 100%);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 60px rgba(255,255,255,.03);
  }
  canvas {
    width: 100%;
    max-width: 720px;
    height: auto;
    aspect-ratio: 1 / 1;
    display: block;
  }
  /* Arrow pointer at top */
  .pointer {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 0 solid transparent;
    border-bottom: 28px solid var(--accent);
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.5));
  }
  .pointer::after {
    content: "";
    position: absolute;
    left: -12px; top: 24px;
    width: 24px; height: 7px;
    background: var(--accent);
    border-radius: 3px;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  #stopBtn, #restartBtn {
    appearance: none;
    border: 0;
    background: linear-gradient(180deg, #54e1d6, #34b5a7);
    color: #042d2a;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .05s ease-in-out;
    box-shadow: 0 8px 18px rgba(52,181,167,.35);
  }
  #stopBtn:active, #restartBtn:active { transform: scale(.98); }
  #status { opacity: .85; font-size: 14px; }
  #legend {
    margin-left: auto; font-size: 12px; opacity: .7;
  }

  /* Overlay that shows final picks */
  #resultOverlay[hidden] { display: none; }
  #resultOverlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(1200px 800px at 50% -10%, #20263a, #0c0f16 60%, #090b11 100%);
    display: grid;
    place-items: center;
    z-index: 50;
    padding: 20px;
  }
  .card {
    width: min(980px, 96vw);
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    padding: clamp(16px, 3vw, 28px);
  }
  .card h1 {
    margin: 0 0 12px 0;
    font-size: clamp(22px, 2.6vw, 34px);
    letter-spacing: .3px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 720px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  .pick {
    display: grid;
    grid-template-columns: 112px 1fr;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 12px;
  }
  .pick img {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 12px;
    display: block;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
  }
  .pick h2 {
    margin: 0 0 6px 0;
    font-size: clamp(18px, 2vw, 22px);
  }
  .muted { opacity: .75; font-size: 14px; }

  /* Subtle toast for instructions */
  .toast {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: .2px;
  }
</style>
</head>
<body>
  <main>
    <section id="wheelArea" aria-live="polite">
      <span class="stageLabel" id="stageLabel">Stage: Theme</span>
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel"></canvas>
      <div class="toast" id="toast">Press <b>Space</b> or tap <b>Stop</b> to choose</div>
    </section>

    <section id="controls">
      <button id="stopBtn" type="button">Stop (Space)</button>
      <div id="status">Spinning…</div>
      <div id="legend">Theme → 3s pause → Genre → Full-screen result</div>
    </section>
  </main>

  <!-- Final result overlay -->
  <div id="resultOverlay" hidden>
    <div class="card">
      <h1>Your Story Prompt</h1>
      <div class="grid">
        <div class="pick">
          <img id="themeImg" alt="Theme image"/>
          <div>
            <h2 id="themeTitle">Theme</h2>
            <div class="muted">Selected theme</div>
          </div>
        </div>
        <div class="pick">
          <img id="genreImg" alt="Genre image"/>
          <div>
            <h2 id="genreTitle">Genre</h2>
            <div class="muted">Selected genre</div>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>
  </div>

<script>
/* ====== Data (as provided) ====== */
const theme = ["Love ", "Friendship", "Good vs. Evil", "Coming of Age", "Identity",
  "Freedom and Confinement", "Fate vs. Free Will", "Justice and Injustice",
  "Power and Corruption", "Revenge", "Loneliness", "Redemption", "Survival",
  "Perseverance", "Oppression"
];

const Genres = ["Romance", "History", "Sci if", "Thriller/Suspense", "Mystery",
  "Adventure", "Action", "Comedy", "Horror", "Fansty", "For Kids"
];

/* ====== Simple emoji “images” for each option (used to generate per-item SVGs) ====== */
const iconMap = {
  // themes
  "Love ": "❤️",
  "Friendship": "🤝",
  "Good vs. Evil": "⚔️",
  "Coming of Age": "🌱",
  "Identity": "🧬",
  "Freedom and Confinement": "🕊️",
  "Fate vs. Free Will": "🧭",
  "Justice and Injustice": "⚖️",
  "Power and Corruption": "👑",
  "Revenge": "🗡️",
  "Loneliness": "🌙",
  "Redemption": "🕯️",
  "Survival": "🛡️",
  "Perseverance": "🏔️",
  "Oppression": "⛓️",
  // genres
  "Romance": "💘",
  "History": "🏺",
  "Sci if": "🚀",              // kept as provided
  "Thriller/Suspense": "🕵️",
  "Mystery": "🕵️‍♀️",
  "Adventure": "🗺️",
  "Action": "💥",
  "Comedy": "😂",
  "Horror": "👻",
  "Fansty": "🧙‍♂️",          // kept as provided
  "For Kids": "🧸",
};

/* Generate a crisp SVG data URI for any label+emoji */
function svgImageDataURI(label) {
  const emoji = iconMap[label] || "🎲";
  const safe = (s)=> s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bd4c5"/><stop offset="100%" stop-color="#1a8a84"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#g)"/>
  <text x="50%" y="44%" dominant-baseline="middle" text-anchor="middle"
        font-size="220" opacity="0.95">` + safe(emoji) + `</text>
  <text x="50%" y="76%" dominant-baseline="middle" text-anchor="middle"
        font-size="44" font-family="Inter,Segoe UI,Arial"
        fill="#052f2b" style="font-weight:700; letter-spacing:.4px">` + safe(label) + `</text>
</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ====== Wheel drawing & logic ====== */
class Wheel {
  constructor(canvas, items, opts={}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.items = items.slice();
    this.rotation = 0;                 // radians
    this.angularVelocity = opts.angularVelocity ?? 2.6; // rad/s (fast-ish)
    this.running = false;
    this.decelerating = false;         // <-- NEW: easing to stop
    this.colors = opts.colors ?? Wheel.generateColors(this.items.length);
    this._raf = null;

    // Precompute text metrics
    this.fontFamily = "600 16px Inter, Segoe UI, Arial";
  }

  static generateColors(n) {
    const arr = [];
    for (let i=0;i<n;i++) {
      const hue = Math.round((360 * i) / n);
      arr.push(`hsl(${hue} 70% 48%)`);
    }
    return arr;
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    const size = Math.min(rect.width, rect.height || rect.width);
    const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    this.canvas.width = Math.round(size * dpr);
    this.canvas.height = Math.round(size * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
    this.draw(); // re-render
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.decelerating = false;
    let last = performance.now();
    const loop = (t) => {
      if (!this.running || this.decelerating) return;
      const dt = (t - last) / 1000; // seconds
      last = t;
      this.rotation = (this.rotation + this.angularVelocity * dt) % (Math.PI*2);
      this.draw();
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  /* Immediate stop (used internally by decelerate) */
  _stopImmediate() {
    this.running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = null;
  }

  /* NEW: Ease-out to a specific slice index (by center), with extra full turns for drama */
  decelerateToIndex(targetIdx, opts={}, onDone) {
    if (this.decelerating) return;
    const easeOutCubic = (x)=> 1 - Math.pow(1 - x, 3);
    const n = this.items.length;
    const arc = (Math.PI * 2) / n;
    const pointer = -Math.PI / 2;
    const norm = (a)=>{ a = a % (Math.PI*2); return a<0 ? a + Math.PI*2 : a; };

    // Where should rotation land so targetIdx is centered under the pointer?
    const targetCenter = pointer - (targetIdx + 0.5) * arc; // absolute angle (mod 2π)
    const current = this.rotation;
    const currentMod = norm(current);
    const toCenterNext = norm(targetCenter - currentMod); // distance to next time that center passes

    // Add extra spins
    const minTurns = opts.minTurns ?? 2;
    const maxTurns = opts.maxTurns ?? 5;
    const extraTurns = Math.floor(minTurns + Math.random() * (maxTurns - minTurns + 1));
    const totalDelta = toCenterNext + extraTurns * Math.PI * 2;
    const targetRotation = current + totalDelta;

    const duration = opts.duration ?? (2800 + Math.random()*900); // 2.8–3.7s

    // Prepare animation
    this._stopImmediate();        // stop constant-spin loop
    this.decelerating = true;
    const start = performance.now();
    const startRot = this.rotation;

    const anim = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = easeOutCubic(p);
      this.rotation = startRot + (targetRotation - startRot) * eased;
      this.draw(p >= 0.98); // subtle highlight near end
      if (p < 1) {
        this._raf = requestAnimationFrame(anim);
      } else {
        this.decelerating = false;
        this.running = false;
        this._raf = null;
        this.rotation = targetRotation;
        this.draw(true); // final highlight
        if (typeof onDone === 'function') onDone(targetIdx);
      }
    };
    this._raf = requestAnimationFrame(anim);
  }

  draw(highlight = false) {
    const ctx = this.ctx;
    const w = this.canvas.width / (this.ctx.getTransform().a || 1);
    const h = this.canvas.height / (this.ctx.getTransform().a || 1);
    const cx = w / 2;
    const cy = h / 2;
    const R = Math.min(w, h) * 0.46;
    const rHub = R * 0.12;
    const n = this.items.length;
    const arc = (Math.PI * 2) / n;

    ctx.clearRect(0,0,w,h);

    // segments
    for (let i = 0; i < n; i++) {
      const start = i * arc + this.rotation;
      const end = start + arc;

      // wedge
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, start, end);
      ctx.closePath();
      ctx.fillStyle = this.colors[i % this.colors.length];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,.25)";
      ctx.stroke();

      // text centered along the middle radius of each slice
      const label = this.items[i];
      const mid = start + arc / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(mid);
      ctx.textAlign = "center";
      const base = Math.max(14, Math.min(20, R*0.08));
      const fontSize = (label.length > 18) ? base - 3 : base;
      ctx.font = `700 ${fontSize}px Inter, Segoe UI, Arial`;
      ctx.fillStyle = "white";
      ctx.shadowColor = "rgba(0,0,0,.55)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.fillText(label, R * 0.60, 0, R * 0.75);
      ctx.restore();
    }

    // center hub
    ctx.beginPath();
    ctx.arc(cx, cy, rHub, 0, Math.PI*2);
    ctx.fillStyle = "#0b0d12";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,.15)";
    ctx.stroke();

    // highlight the slice currently under the arrow if requested
    if (highlight) {
      const idx = this.indexUnderPointer();
      if (idx != null) {
        const start = idx * arc + this.rotation;
        const end = start + arc;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, start, end);
        ctx.closePath();
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fill();
        ctx.restore();
      }
    }
  }

  indexUnderPointer() {
    const pointer = -Math.PI / 2; // 12 o’clock
    const n = this.items.length;
    const arc = (Math.PI * 2) / n;
    const norm = (a)=>{ a = a % (Math.PI*2); return a<0 ? a + Math.PI*2 : a; };
    const rel = norm(pointer - this.rotation);
    let idx = Math.floor(rel / arc);
    if (idx < 0) idx += n;
    if (idx >= n) idx -= n;
    return idx;
  }

  currentItem() {
    const i = this.indexUnderPointer();
    return this.items[i];
  }
}

/* ====== App State ====== */
const canvas = document.getElementById('wheel');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const stageLabel = document.getElementById('stageLabel');
const toast = document.getElementById('toast');

const overlay = document.getElementById('resultOverlay');
const themeTitle = document.getElementById('themeTitle');
const genreTitle = document.getElementById('genreTitle');
const themeImg = document.getElementById('themeImg');
const genreImg = document.getElementById('genreImg');
const restartBtn = document.getElementById('restartBtn');

let stage = 'theme'; // 'theme' -> 'genre' -> 'done'
let wheel = null;
let pickTheme = null;
let pickGenre = null;

/* NEW: remember last index per wheel so we never repeat the immediate previous result */
const lastIdx = { theme: -1, genre: -1 };

function randomIndexExcluding(n, excludeIdx) {
  if (n <= 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * n); } while (i === excludeIdx);
  return i;
}

function makeWheel(items) {
  const w = new Wheel(canvas, items);
  w.resize();
  w.start();
  return w;
}

function setStage(next) {
  stage = next;
  stageLabel.textContent = `Stage: ${next[0].toUpperCase()}${next.slice(1)}`;
  statusEl.textContent = 'Spinning…';
  toast.textContent = 'Press Space or tap Stop to choose';
}

function startTheme() {
  setStage('theme');
  wheel = makeWheel(theme);
}

function startGenreAfterDelay(ms = 3000) {
  statusEl.textContent = `Theme locked: “${pickTheme}”. Next wheel starting…`;
  setTimeout(() => {
    setStage('genre');
    wheel = makeWheel(Genres);
  }, ms);
}

function showResultOverlay() {
  themeTitle.textContent = pickTheme;
  genreTitle.textContent = pickGenre;
  themeImg.src = svgImageDataURI(pickTheme);
  genreImg.src = svgImageDataURI(pickGenre);
  overlay.hidden = false;
}

/* UPDATED: slow down to a stop and then lock the result, avoiding previous pick */
function lockCurrent() {
  if (!wheel || wheel.decelerating || stage === 'done') return;

  stopBtn.disabled = true;
  toast.textContent = 'Slowing to a stop…';
  statusEl.textContent = 'Slowing…';

  const avoid = (stage === 'theme') ? lastIdx.theme : lastIdx.genre;
  const targetIdx = randomIndexExcluding(wheel.items.length, avoid);

  wheel.decelerateToIndex(
    targetIdx,
    { minTurns: 2, maxTurns: 5, duration: 2800 + Math.random()*900 },
    (finalIdx) => {
      stopBtn.disabled = false;

      if (stage === 'theme') {
        pickTheme = wheel.items[finalIdx];
        lastIdx.theme = finalIdx;                   // remember to avoid next time
        statusEl.textContent = `Theme: “${pickTheme}”`;
        startGenreAfterDelay(3000);
      } else if (stage === 'genre') {
        pickGenre = wheel.items[finalIdx];
        lastIdx.genre = finalIdx;                   // remember to avoid next time
        statusEl.textContent = `Genre: “${pickGenre}”`;
        setStage('done');
        setTimeout(showResultOverlay, 400);
      }
    }
  );
}

/* ====== Events ====== */
window.addEventListener('resize', () => { if (wheel) wheel.resize(); }, { passive: true });

stopBtn.addEventListener('click', lockCurrent);
canvas.addEventListener('click', lockCurrent); // tap canvas on mobile to stop too

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    lockCurrent();
  }
}, { passive: false });

restartBtn.addEventListener('click', () => {
  overlay.hidden = true;
  pickTheme = null; pickGenre = null;
  setStage('theme');
  wheel = makeWheel(theme);
});

/* ====== Init ====== */
startTheme();
</script>
</body>
</html>
