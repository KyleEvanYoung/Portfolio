<div class="class5">

			<div style="width: 100%; margin-top: 200px; height: auto;">

					  <h1 class="class4">Submit Your Info</h1>

						<p class="class21">First Name:</p>

  <style>
    form {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
    }
    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
<script>
  const form = document.getElementById('dataForm');
  const status = document.getElementById('status');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    status.textContent = 'Sending...';

    const formData = new FormData(form);
    
    fetch('https://script.google.com/macros/s/AKfycbyPGuWCRUbjf3dUlxtNC2Ejz2QnpWtmbs6fXqLQSjfxh2I96MyAHFT-b2FVMnrOSa_f/exec', {
      method: 'POST',
      body: formData
    })
    .then(response => response.text())
    .then(text => {
      if (text === 'Success') {
        status.textContent = 'Data sent successfully!';
        form.reset();
      } else {
        status.textContent = 'Error: ' + text;
      }
    })
    .catch(error => {
      status.textContent = 'Submission failed.';
      console.error(error);
    });
  });
</script>

  <script>
    const images = {
      theme1: ["assets/svg/basic_icons/3d_printer_white.svg", "assets/svg/basic_icons/assets_white.svg"
	  ,"assets/svg/basic_icons/books_white.svg","assets/svg/basic_icons/contact_me_blue.svg","assets/svg/basic_icons/controller_white.svg"
	  ,"assets/svg/basic_icons/render_changllenes_white.svg","assets/svg/basic_icons/settings_white.svg","assets/svg/basic_icons/website_white.svg"],
      theme2: ["assets/svg/basic_icons/3d_printer_black.svg", "assets/svg/basic_icons/assets_black.svg"
	  ,"assets/svg/basic_icons/books_black.svg","assets/svg/basic_icons/contact_me_green.svg","assets/svg/basic_icons/controller_black.svg"
	  ,"assets/svg/basic_icons/render_changllenes_black.svg","assets/svg/basic_icons/settings_black.svg","assets/svg/basic_icons/website_black.svg"],
      theme3: ["assets/svg/basic_icons/3d_printer_blue.svg", "assets/svg/basic_icons/assets_blue.svg"
	  ,"assets/svg/basic_icons/books_blue.svg","assets/svg/basic_icons/contact_me_black.svg","assets/svg/basic_icons/controller_blue.svg"
	  ,"assets/svg/basic_icons/render_changllenes_blue.svg","assets/svg/basic_icons/settings_blue.svg","assets/svg/basic_icons/website_blue.svg"],
      theme4: ["assets/svg/basic_icons/3d_printer_red.svg", "assets/svg/basic_icons/assets_red.svg"
	  ,"assets/svg/basic_icons/books_red.svg","assets/svg/basic_icons/contact_me_white.svg","assets/svg/basic_icons/controller_red.svg"
	  ,"assets/svg/basic_icons/render_changllenes_red.svg","assets/svg/basic_icons/settings_red.svg","assets/svg/basic_icons/website_red.svg"],
      theme5: ["assets/svg/basic_icons/3d_printer_green.svg", "assets/svg/basic_icons/assets_green.svg"
	  ,"assets/svg/basic_icons/books_green.svg","assets/svg/basic_icons/contact_me_white.svg","assets/svg/basic_icons/controller_green.svg"
	  ,"assets/svg/basic_icons/render_changllenes_green.svg","assets/svg/basic_icons/settings_green.svg","assets/svg/basic_icons/website_green.svg"],
      theme6: ["assets/svg/basic_icons/3d_printer.svg", "assets/svg/basic_icons/assets.svg"
	  ,"assets/svg/basic_icons/books.svg","assets/svg/basic_icons/contact_me.svg","assets/svg/basic_icons/controller.svg"
	  ,"assets/svg/basic_icons/render_changllenes.svg","assets/svg/basic_icons/settings.svg","assets/svg/basic_icons/website.svg"],
    };

    function applyThemeClasses(theme) {
      for (let i = 1; i <= 100; i++) {
        const els = document.getElementsByClassName(`class${i}`);
        for (let el of els) {
          el.className = `class${i} ${theme}`;
        }
      }
    }

    function loadImages(theme) {
      const imgList = images[theme];
      for (let i = 0; i < imgList.length; i++) {
        document.getElementById(`img${i + 1}`).src = imgList[i];
      }
    }

    window.onload = () => {
      const theme = localStorage.getItem("selectedTheme") || "theme1";
      applyThemeClasses(theme);
      loadImages(theme);
    };
  </script>
</body>
