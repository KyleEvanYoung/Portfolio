<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookFlix</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
  <div id="preloader" class="preloader" aria-label="Loading">
    <img src="loader.gif" alt="Loading" onerror="this.style.display='none'" />
    <p>Loading BookFlix...</p>
  </div>

  <aside id="options_menu" class="side-panel" aria-label="Options menu">
    <button class="close-panel" data-close-panel>×</button>
    <h2>Login</h2>
    <div id="loginBox" class="panel-card">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Login</button>
      <p id="loginStatus" class="small-status"></p>
    </div>

    <h2>Make An Account</h2>
    <div class="panel-card">
      <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password" />
      <button id="signupBtn">Make Account</button>
      <button id="forgotBtn" class="ghost-btn">Forgotten password</button>
      <p id="signupStatus" class="small-status"></p>
    </div>

    <h2>Theme</h2>
    <div class="panel-card">
      <select id="themeSelect">
        <option value="Default">Default</option>
        <option value="Midnight">Midnight Ebook</option>
        <option value="Parchment">Parchment Ebook</option>
        <option value="HighContrast">High Contrast</option>
        <option value="Ruby">Ruby Dark</option>
      </select>
    </div>

    <h2>Story Types</h2>
    <div id="storyTypeFilters" class="panel-card check-list"></div>
  </aside>

  <aside id="libraryPanel" class="library-panel" aria-label="Libary">
    <div class="library-head">
      <h2>Libary</h2>
      <button class="close-panel" data-close-library>×</button>
    </div>
    <div id="libraryGrid" class="book-grid"></div>
  </aside>

  <main id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">BookFlix</div>
      <div class="top-actions">
        <button id="libraryBtn" class="top-btn">Libary</button>
        <button id="menuBtn" class="sandwich" aria-label="Open options menu"><span></span><span></span><span></span></button>
      </div>
    </header>

    <section id="hero" class="hero" aria-label="Featured stories"></section>
    <div id="heroDots" class="dots"></div>

    <section class="filters-row">
      <label>Series
        <select id="seriesFilter"><option value="All">All</option></select>
      </label>
      <label>Genres
        <select id="genreFilter"><option value="All">All</option></select>
      </label>
    </section>

    <section id="releaseSection" class="book-section">
      <div class="section-title"><h2>Sorted By Release Date</h2></div>
      <div id="releaseGrid" class="book-grid"></div>
    </section>

    <section id="genresContainer"></section>
  </main>

  <div id="bookModal" class="modal hidden" role="dialog" aria-modal="true">
    <button class="close-modal" data-close-modal>×</button>
    <div id="bookModalBody" class="modal-body"></div>
  </div>

  <div id="reader" class="reader hidden" role="dialog" aria-modal="true">
    <div class="reader-toolbar">
      <button id="closeReader">Close</button>
      <label>Text Size <input id="readerSize" type="range" min="14" max="28" value="18" /></label>
      <label>Font
        <select id="readerFont">
          <option value="Georgia, serif">Serif</option>
          <option value="Arial, sans-serif">Sans</option>
          <option value="Verdana, sans-serif">Verdana</option>
        </select>
      </label>
      <label>Theme
        <select id="readerTheme">
          <option value="reader-dark">Dark</option>
          <option value="reader-paper">Paper</option>
          <option value="reader-light">Light</option>
        </select>
      </label>
      <span id="readerProgress">0%</span>
    </div>
    <article id="readerContent" class="reader-content"></article>
  </div>

  <script src="stories.js"></script>
  <script src="script.js"></script>
</body>
</html>
