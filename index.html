<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookFlix</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
  <div id="preloader" class="preloader">
    <img src="loader.gif" alt="Loading" onerror="this.style.display='none'" />
    <p>Loading BookFlix...</p>
  </div>

  <header class="app-header">
    <button id="libraryButton" class="header-button">Libary</button>
    <h1>BookFlix</h1>
    <div class="header-actions">
      <button id="searchButton" class="icon-button" aria-label="Search">⌕</button>
      <button id="menuButton" class="menu-button" aria-label="Open options menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main id="app" class="app-shell">
    <section id="hero" class="hero"></section>

    <section class="toolbar glass">
      <label>
        Search
        <input id="storySearch" type="search" placeholder="Find a story..." />
      </label>
      <label>
        Series
        <select id="seriesFilter"><option value="all">All Series</option></select>
      </label>
      <label>
        Genre
        <select id="genreFilter"><option value="all">All Genres</option></select>
      </label>
    </section>

    <section id="releaseSection" class="story-section"></section>
    <section id="genreSections" class="genre-sections"></section>
  </main>

  <aside id="options_menu" class="options-panel" aria-label="Options menu">
    <div class="panel-header">
      <h2>Options</h2>
      <button id="closeOptions" class="icon-button">×</button>
    </div>

    <div id="loginArea" class="option-card">
      <h3>Login</h3>
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginSubmit">Login</button>
      <p id="loginStatus"></p>
    </div>

    <div class="option-card">
      <h3>Make An Account</h3>
      <input id="newEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="newPassword" type="password" placeholder="Password" autocomplete="new-password" />
      <button id="makeAccountButton">Make Account</button>
      <button id="forgotPasswordButton" class="secondary">Forgotten password</button>
      <p id="accountStatus"></p>
    </div>

    <div class="option-card">
      <h3>Theme Style</h3>
      <select id="themeSelect">
        <option value="Default">Default</option>
        <option value="Ebook Dark">Ebook Dark</option>
        <option value="Paper">Paper</option>
        <option value="Midnight Red">Midnight Red</option>
        <option value="Ocean">Ocean</option>
      </select>
    </div>

    <div class="option-card">
      <h3>Story Length</h3>
      <label><input type="checkbox" class="typeToggle" value="FlashFiction" checked /> Flash Fiction (1 to 5 pages)</label>
      <label><input type="checkbox" class="typeToggle" value="ShortStory" checked /> Short Story (5 to 25 pages)</label>
      <label><input type="checkbox" class="typeToggle" value="Novelette" checked /> Novelette (25 to 60 pages)</label>
      <label><input type="checkbox" class="typeToggle" value="Novella" checked /> Novella (60 to 150 pages)</label>
      <label><input type="checkbox" class="typeToggle" value="Novel" checked /> Novel (150 pages)</label>
    </div>
  </aside>

  <section id="libraryPanel" class="library-panel" aria-label="Libary">
    <div class="panel-header">
      <h2>Libary</h2>
      <button id="closeLibrary" class="icon-button">×</button>
    </div>
    <div id="libraryBooks" class="book-grid"></div>
  </section>

  <dialog id="storyModal" class="story-modal">
    <button id="closeModal" class="modal-close">×</button>
    <div id="modalContent"></div>
  </dialog>

  <section id="reader" class="reader hidden">
    <div class="reader-bar">
      <button id="closeReader">← Back</button>
      <div>
        <strong id="readerTitle"></strong>
        <span id="readerPercent">0%</span>
      </div>
      <div class="reader-controls">
        <select id="readerTheme">
          <option value="reader-dark">Dark</option>
          <option value="reader-paper">Paper</option>
          <option value="reader-sepia">Sepia</option>
        </select>
        <input id="fontSize" type="range" min="14" max="30" value="18" title="Text size" />
        <select id="fontFamily">
          <option value="Georgia, serif">Georgia</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Times New Roman, serif">Times</option>
        </select>
      </div>
    </div>
    <article id="readerContent" class="reader-content"></article>
  </section>

  <script src="stories.js"></script>
  <script src="script.js"></script>
</body>
</html>
